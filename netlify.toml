# Netlify deploy config for Remote Income System
# Static site + one serverless function (payment verification).
# Fixed: removed empty build command so files publish to production.

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/verify"
  to = "/.netlify/functions/verify"
  status = 200

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
